server:
  port: ${PORT:8080}

spring:
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

surshongi:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  site-url: ${SITE_URL:${NEXT_PUBLIC_SITE_URL:http://localhost:3000}}
  database-url: ${DATABASE_URL:postgresql://surshongi:surshongi_pass@localhost:5432/surshongi_db}
  session-secret: ${SESSION_SECRET:${GOOGLE_CLIENT_SECRET:}}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  google-client-secret: ${GOOGLE_CLIENT_SECRET:}
  upload-dir: ${UPLOAD_DIR:uploads}
  smtp-user: ${SMTP_USER:}
  smtp-pass: ${SMTP_PASS:}
