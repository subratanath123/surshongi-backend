# Production Compose. MongoDB is Atlas, configured by MONGODB_URI in the .env
# file beside this file. This file does not start a database container.
# `docker compose up -d api` pulls the published image and starts the API.
# Audio is stored in MongoDB. Images and video stay in the uploads folder.

services:
  api:
    image: ${DOCKER_IMAGE:-2011331031/surshongi-api:latest}
    pull_policy: missing
    container_name: surshongi-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_MONGODB_URI: ${MONGODB_URI}
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
